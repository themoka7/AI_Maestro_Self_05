name: 일일 보도 분석

# KST 06:00 = UTC 21:00 (전날). 이 시각에 돌면 대상은 "어제(KST)" 하루치입니다.
# 파이프라인은 datetime.now(KST) 로 날짜를 계산하므로 러너 타임존(UTC)과 무관합니다.
#
# 주의: GitHub 의 schedule 트리거는 **기본 브랜치에 있는 워크플로만** 실행합니다.
# 이 파일이 기본 브랜치에 없으면 수동 실행(workflow_dispatch)만 동작합니다.
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "대상 날짜 YYYY-MM-DD (비우면 어제, KST)"
        required: false
        type: string

# 같은 날짜를 두 번 돌려도 결과는 같지만, 커밋이 충돌하므로 직렬화합니다.
concurrency:
  group: daily-analysis
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: 의존성 설치
        run: pip install -r pipeline/requirements.txt

      - name: 대상 날짜 결정
        id: target
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            echo "date=${{ inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(TZ=Asia/Seoul date -d 'yesterday' +%F)" >> "$GITHUB_OUTPUT"
          fi

      # 러너는 매번 초기화됩니다. 커밋된 JSON 에서 SQLite 를 재구성합니다.
      # 보도자료는 매칭에 7일 소급이 필요하므로 반드시 복원해야 합니다.
      - name: 히스토리 복원
        run: python pipeline/history.py restore

      - name: 보도자료 수집
        run: python pipeline/collect_pr.py || echo "보도자료 소스가 비활성 상태입니다"

      - name: 기사 수집
        env:
          NCP_API_KEY_ID: ${{ secrets.NCP_API_KEY_ID }}
          NCP_API_KEY: ${{ secrets.NCP_API_KEY }}
        run: python pipeline/collect_news.py --date "${{ steps.target.outputs.date }}"

      - name: 본문 추출
        run: python pipeline/extract_body.py --date "${{ steps.target.outputs.date }}"

      - name: 전재 클러스터링
        run: python pipeline/dedup.py --date "${{ steps.target.outputs.date }}"

      - name: 보도자료 매칭
        run: python pipeline/match.py --date "${{ steps.target.outputs.date }}"

      - name: 프레이밍 분류
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLASSIFIER_MODEL: ${{ vars.CLASSIFIER_MODEL || 'claude-sonnet-5' }}
        run: |
          python pipeline/classify.py \
            --date "${{ steps.target.outputs.date }}" \
            --poll 30 --max-wait 3600

      - name: 일별 결과 내보내기
        run: python pipeline/export.py --date "${{ steps.target.outputs.date }}"

      - name: 보도자료 스냅샷
        run: python pipeline/history.py snapshot

      - name: 언론사별 누적 집계
        run: python pipeline/aggregate.py | tee -a "$GITHUB_STEP_SUMMARY"

      # 문장 대조 데이터는 기사 수에 비례해 커집니다. 통계는 계속 쌓되 대조는 30일만.
      - name: 오래된 대조 데이터 정리
        run: python pipeline/history.py prune --keep-days 30

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore(data): ${{ steps.target.outputs.date }} 보도 분석 결과"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "푸시 실패, $((2**i))초 후 재시도"
            sleep $((2**i))
          done
          exit 1
